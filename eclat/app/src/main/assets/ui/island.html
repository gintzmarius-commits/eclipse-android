<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Éclat</title>
<style>
  :root { --font: "Inter", "Roboto Flex", Roboto, system-ui, sans-serif; --accent: #f6a51a; --accent-hi: #ffc24d; --accent-ink: #2a1800; --top: 6px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 15px/1.35 var(--font); color: #fff;
    user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased; }
  svg { width: 20px; height: 20px; flex: none; }
  [hidden] { display: none !important; }

  /* The island: a black capsule that grows from the camera into a card. */
  .island { position: absolute; left: 50%; top: var(--top); transform: translateX(-50%); width: 128px; height: 36px; border-radius: 22px;
    background: rgba(8, 8, 12, .96); overflow: hidden; touch-action: none;
    box-shadow: 0 0 0 .5px rgba(255, 255, 255, .14), 0 18px 50px rgba(0, 0, 0, .35);
    transition: width .5s cubic-bezier(.32, 1.4, .4, 1), height .5s cubic-bezier(.32, 1.4, .4, 1), border-radius .5s, transform .35s cubic-bezier(.2, .9, .3, 1), opacity .3s; }
  .island.open { width: min(calc(100vw - 16px), 420px); height: var(--h, 168px); border-radius: 36px; }
  .island.gone { transform: translate(-50%, -140%); opacity: 0; }
  .island::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 90% at 0% 0%, rgba(255, 194, 77, .16), transparent 55%); }

  .pill { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; transition: opacity .2s; }
  .island.open .pill { opacity: 0; pointer-events: none; }
  .pill .waves { color: var(--accent-hi); animation: pulse 1.1s ease-in-out infinite; }
  .pill .dot { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--accent-hi) var(--p, 0%), rgba(255, 255, 255, .15) 0); }
  @keyframes pulse { 50% { opacity: .35; } }

  .body { position: absolute; left: 0; right: 0; top: 0; padding: 16px 16px 14px; opacity: 0; transform: scale(.94); transform-origin: 50% 0;
    transition: opacity .25s .12s, transform .4s .08s cubic-bezier(.2, .9, .3, 1); display: flex; flex-direction: column; gap: 14px; }
  .island.open .body { opacity: 1; transform: none; }
  .head { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .thumb { position: relative; width: 58px; height: 58px; border-radius: 16px; flex: none; display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(160deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .06)); color: var(--accent-hi); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { width: 28px; height: 28px; }
  .thumb .ring { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .45); }
  .thumb .ring svg { width: 46px; height: 46px; transform: rotate(-90deg); }
  .thumb .ok { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(16, 137, 62, .75); color: #fff; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .from { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent-hi); display: flex; align-items: center; gap: 5px; }
  .from svg { width: 14px; height: 14px; }
  .title { font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; color: rgba(255, 255, 255, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg { font-size: 13.5px; color: rgba(255, 255, 255, .75); margin-top: -4px; }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; height: 44px; border-radius: 999px; border: 0; font: inherit; font-weight: 700; font-size: 15px; color: #fff;
    background: rgba(255, 255, 255, .14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform .1s; }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: linear-gradient(180deg, var(--accent-hi), var(--accent)); color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 6px 18px rgba(246, 165, 26, .35); }
  .spin { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); border-top-color: var(--accent-hi); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-nfc" viewBox="0 0 24 24"><path d="M6.5 8.5a5 5 0 0 1 0 7M9.8 6a8.6 8.6 0 0 1 0 12M13.2 3.6a12 12 0 0 1 0 16.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="12" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9.5" r="1.7" fill="currentColor"/><path d="M4 17l4.5-4.5 3.5 3.5 2.5-2.5 5.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 10.5l5-3v9l-5-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="island" id="island">
  <div class="pill"><svg class="waves"><use href="#i-nfc"/></svg><i class="dot" id="pill-dot" hidden></i></div>
  <div class="body" id="body">
    <div class="head">
      <div class="thumb" id="thumb"><svg><use href="#i-file"/></svg></div>
      <div class="txt">
        <span class="from" id="from"><svg><use href="#i-nfc"/></svg><span id="from-text">Éclat</span></span>
        <span class="title" id="title"></span>
        <span class="sub" id="sub"></span>
      </div>
    </div>
    <div class="msg" id="msg" hidden></div>
    <div class="row" id="actions"></div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const N = window.EclatIsland || { accept() { setTimeout(() => island.state({ phase: 'receiving', got: 0, total: 1 }), 300); let g = 0; const t = setInterval(() => { g += .12; island.state(g >= 1 ? { phase: 'done' } : { phase: 'receiving', got: g, total: 1 }); if (g >= 1) clearInterval(t); }, 400); }, decline() { }, close() { }, open() { }, cancel() { } };
const box = $('island');
let offer = null, phase = 'offer', closeTimer = null;

function fmtSize(n) {
  if (n == null || n < 0) return '';
  if (n < 1024) return n + ' o';
  const u = ['Ko', 'Mo', 'Go', 'To']; let v = n / 1024, i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toLocaleString('fr-FR', { maximumFractionDigits: v < 10 ? 1 : 0 }) + ' ' + u[i];
}
const kindIcon = m => m.startsWith('image/') ? 'i-photo' : m.startsWith('video/') ? 'i-video' : m.startsWith('audio/') ? 'i-music' : 'i-file';
const what = m => m.startsWith('image/') ? 'une photo' : m.startsWith('video/') ? 'une vidéo' : m.startsWith('audio/') ? 'une musique' : 'un fichier';

function grow() {
  // the card's height follows its content
  requestAnimationFrame(() => {
    box.style.setProperty('--h', ($('body').scrollHeight) + 'px');
    box.classList.add('open');
  });
}

function actions(list) {
  const row = $('actions');
  row.innerHTML = '';
  for (const [label, fn, primary] of list) {
    const b = document.createElement('button');
    b.className = 'btn' + (primary ? ' primary' : '');
    b.innerHTML = label;
    b.onclick = fn;
    row.appendChild(b);
  }
  row.hidden = !list.length;
}

function msg(text) { $('msg').hidden = !text; $('msg').innerHTML = text || ''; }

function thumbOverlay(html) {
  const t = $('thumb');
  t.querySelectorAll('.ring,.ok').forEach(x => x.remove());
  if (html) t.insertAdjacentHTML('beforeend', html);
}

function dismiss(then) {
  box.classList.remove('open');
  setTimeout(() => box.classList.add('gone'), 260);
  setTimeout(() => (then || N.close).call(N), 600);
}

window.island = {
  setTop(px) { document.documentElement.style.setProperty('--top', Math.max(4, (px - 36) / 2) + 'px'); },

  offer(o) {
    const first = !offer;
    offer = o;
    if (phase !== 'offer') return;
    $('from-text').textContent = o.device || 'Un téléphone';
    $('title').textContent = o.name;
    $('sub').textContent = `veut t'envoyer ${what(o.mime)} · ${fmtSize(o.size)}`;
    const t = $('thumb');
    if (o.thumb) {
      if (!t.querySelector('img')) t.insertAdjacentHTML('afterbegin', '<img alt="">');
      t.querySelector('img').src = o.thumb;
    } else if (!t.querySelector('img')) {
      t.innerHTML = `<svg><use href="#${kindIcon(o.mime)}"/></svg>`;
    }
    if (!o.reachable && !o.checking) {
      msg(`Les deux téléphones doivent être sur le même Wi-Fi.`);
      actions([['Fermer', () => dismiss()]]);
    } else {
      msg(o.checking ? '' : (o.hotspot && o.reachable === true ? '' : ''));
      actions([['Refuser', () => dismiss(N.decline)], ['Accepter', () => { N.accept(); island.state({ phase: 'connecting' }); }, true]]);
    }
    if (first) setTimeout(grow, 350); else grow();
  },

  state(s) {
    if (!s || !s.phase) return;
    phase = s.phase;
    clearTimeout(closeTimer);
    switch (s.phase) {
      case 'connecting':
        $('sub').innerHTML = '<span class="spin"></span> Connexion…';
        msg(''); actions([]); thumbOverlay(''); break;
      case 'joining':
        $('sub').textContent = 'Connexion au Wi-Fi de l\'autre téléphone…';
        msg('Android va te demander d\'accepter ce réseau : touche « Se connecter ».');
        actions([['Annuler', () => { N.cancel(); dismiss(); }]]); break;
      case 'receiving': {
        const p = s.total > 0 ? Math.min(1, s.got / s.total) : 0;
        const c = 2 * Math.PI * 20;
        $('sub').textContent = `Réception… ${Math.round(p * 100)} %` + (s.total > 0 ? ` · ${fmtSize(s.total)}` : '');
        thumbOverlay(`<div class="ring"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/><circle cx="24" cy="24" r="20" fill="none" stroke="#ffc24d" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}"/></svg></div>`);
        $('pill-dot').style.setProperty('--p', (p * 100) + '%');
        msg(''); actions([['Masquer', () => dismiss()]]); break;
      }
      case 'done':
        thumbOverlay(`<div class="ok"><svg><use href="#i-check"/></svg></div>`);
        $('sub').textContent = 'Reçu ! Enregistré sur ce téléphone.';
        msg(''); actions([['Fermer', () => dismiss()], ['Ouvrir', () => dismiss(N.open), true]]);
        closeTimer = setTimeout(() => dismiss(), 9000);
        break;
      case 'error': case 'cancelled':
        thumbOverlay('');
        $('sub').textContent = s.phase === 'cancelled' ? 'Annulé' : 'Pas reçu';
        msg(s.error || ''); actions([['Fermer', () => dismiss()]]); break;
    }
    grow();
  },
};

// Swipe the island up: put it away (says no if nothing was accepted yet).
let y0 = null;
box.addEventListener('pointerdown', e => { y0 = e.clientY; });
box.addEventListener('pointermove', e => {
  if (y0 == null) return;
  const dy = Math.min(0, e.clientY - y0);
  box.style.transform = `translate(-50%, ${dy}px)`;
});
const up = e => {
  if (y0 == null) return;
  const dy = e.clientY - y0; y0 = null;
  box.style.transform = '';
  if (dy < -40) dismiss(phase === 'offer' ? N.decline : N.close);
};
box.addEventListener('pointerup', up);
box.addEventListener('pointercancel', up);

if (!window.EclatIsland) { // preview in a browser
  setTimeout(() => island.offer({ name: 'Coucher de soleil à Biarritz.jpg', size: 3456789, mime: 'image/jpeg', device: 'Galaxy de Léa', thumb: '', reachable: true, checking: false }), 200);
}
</script>
</body>
</html>
