name: Build Eclipse APK

on:
  push:
    # main publishes the APK; dev/... branches make a private test build
    branches: [main, "dev/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Eclipse sources
        uses: actions/checkout@v5

      - name: Eclipse tests (QR code reading)
        run: |
          mkdir -p /tmp/t
          scripts/ci_run.sh "Tests Eclipse" bash -c "javac -encoding UTF-8 -d /tmp/t eclipse/java/com/limelight/EclipseQr.java tests/EclipseQrTest.java && java -Dstdout.encoding=UTF-8 -cp /tmp/t EclipseQrTest"
          # The Go library may only be loaded in the built-in Tailscale's own
          # process (EclipseTunnelProvider): a failure there must never close Eclipse.
          if grep -rl "eclipsenet\." eclipse/java | grep -v EclipseTunnelProvider.java; then
            echo "::error::Seul EclipseTunnelProvider peut appeler la bibliothèque Go"; exit 1
          fi

      - name: Moonlight sources (commit from upstream.txt)
        run: |
          git init -q moonlight
          cd moonlight
          git remote add origin https://github.com/moonlight-stream/moonlight-android
          git fetch -q --depth 1 origin "$(cat ../upstream.txt)"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive
          git log -1 --format='Moonlight %h — %s'

      - name: Apply Eclipse changes
        run: scripts/ci_run.sh "Changements Eclipse" python3 scripts/apply_eclipse.py moonlight

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK licences
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # Gradle downloads the exact platform and NDK Moonlight asks for.
          AVAIL=$("$SDKM" --list 2>/dev/null | tr '\r' '\n' | grep -oE '(platforms;android-3[6-9][^ ]*|ndk;29[^ ]*)' | sort -u | tr '\n' ' ')
          echo "::notice title=SDK disponibles::$AVAIL"

      - name: Go (for the built-in Tailscale)
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false

      - name: Eclipse for PC (tests; its Linux build serves the emulator tests)
        run: scripts/ci_run.sh "Eclipse pour PC" bash -c "cd pc && go vet . && GOOS=windows go vet . && go test -count=1 . && CGO_ENABLED=0 go build -o ../eclipse-pc ."

      - name: Built-in Tailscale (Go library for Android)
        run: scripts/ci_run.sh "Tailscale intégré" scripts/build_tunnel.sh moonlight/app/libs

      - name: Logs of the built-in Tailscale tests (when they fail)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-failure -y --cleanup-tag 2>/dev/null || true
          ls tunnel-test.log tunnel-e2e.log 2>/dev/null
          gh release create build-failure $(ls tunnel-test.log tunnel-e2e.log 2>/dev/null) --draft --prerelease \
            --title "Échec de build (${GITHUB_SHA::7})" --notes "Journaux des tests du Tailscale intégré." || true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: moonlight
        env:
          ECLIPSE_KEYSTORE: ${{ github.workspace }}/signing/eclipse.keystore
          ECLIPSE_KEYSTORE_PASSWORD: eclipse-public-key
        run: ../scripts/ci_run.sh "Compilation" ./gradlew --no-daemon --stacktrace assembleNonRootRelease

      - name: The APK
        run: |
          APK=$(ls moonlight/app/build/outputs/apk/nonRoot/release/*.apk | head -1)
          cp "$APK" Eclipse.apk
          ls -la Eclipse.apk

      - name: Check the APK (classes created by reflection, signature)
        run: scripts/ci_run.sh "Vérification de l'APK" python3 scripts/check_apk.py Eclipse.apk "$(cat VERSION)" E4:AD:E3:BA:64:AE:04:E2:D7:B9:9B:0B:19:77:A0:AF:72:F2:80:B9:37:8A:12:FF:50:DD:62:39:00:17:1D:9F

      # Same app, with the built-in Tailscale also for x86_64: the Android
      # emulator (x86_64) can then run it for real (only the packaging
      # differs; the code is the one of Eclipse.apk).
      - name: Emulator build
        working-directory: moonlight
        env:
          ECLIPSE_KEYSTORE: ${{ github.workspace }}/signing/eclipse.keystore
          ECLIPSE_KEYSTORE_PASSWORD: eclipse-public-key
        run: |
          ../scripts/ci_run.sh "Compilation (émulateur)" ./gradlew --no-daemon assembleNonRootRelease -PeclipseEmulator=true
          cp "$(ls app/build/outputs/apk/nonRoot/release/*.apk | head -1)" ../Eclipse-emulator.apk
          unzip -l ../Eclipse-emulator.apk | grep libgojni

      - name: Keep the APKs for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            Eclipse.apk
            Eclipse-emulator.apk
            tunnel-e2e.log
            fakepc.test
            eclipse-pc

  emulator:
    # Eclipse used like a person would, on Android 8 to 16 (see
    # scripts/smoke_test.sh). The APK is published only if all pass.
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 31, 34, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test PC on a private Tailscale network
        run: |
          # The emulator reaches this machine at 10.0.2.2: give it that address too.
          sudo ip addr add 10.0.2.2/32 dev lo
          chmod +x apk/fakepc.test apk/eclipse-pc
          mkdir -p /tmp/sun /tmp/pchome/Documents /tmp/pcdl
          echo "Rapport de test Eclipse" > /tmp/pchome/Documents/rapport-eclipse.txt
          ECLIPSE_FAKE_PC=/tmp/fakepc ECLIPSE_FAKE_SUNSHINE=/tmp/sun nohup apk/fakepc.test -test.run TestEmulatorPC -test.v -test.timeout 60m > /tmp/fakepc.log 2>&1 &
          for i in $(seq 1 90); do [ -s /tmp/fakepc ] && break; sleep 1; done
          cat /tmp/fakepc || { tail -30 /tmp/fakepc.log; echo "::warning::PC de test indisponible"; }
          # Eclipse for PC itself (file sharing), with the test PC's Sunshine folder.
          HOME=/tmp/pchome XDG_CONFIG_HOME=/tmp/pchome/.config XDG_STATE_HOME=/tmp/pchome/.state ECLIPSE_SUNSHINE_CONFIG=/tmp/sun \
            ECLIPSE_NOWINDOW=1 ECLIPSE_NO_SETUP=1 ECLIPSE_DOWNLOADS=/tmp/pcdl nohup apk/eclipse-pc > /tmp/eclipse-pc.out 2>&1 &
          for i in $(seq 1 30); do grep -q "t=" /tmp/eclipse-pc.out && break; sleep 1; done
          cat /tmp/eclipse-pc.out
      - name: Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: FAKE_PC=/tmp/fakepc FAKE_PC_LOG=/tmp/fakepc.log PC_URL_FILE=/tmp/eclipse-pc.out PC_DOWNLOADS=/tmp/pcdl bash scripts/smoke_test.sh apk/Eclipse-emulator.apk out
      - name: Results
        if: always()
        run: |
          cat out/result.txt || true
          if [ -f out/result.txt ]; then
            sum=$(grep -E "^(FAIL|SMOKE)" out/result.txt | tr '\n' ' ' | cut -c1-900)
            echo "::notice title=Android API ${{ matrix.api }}::${sum:-pas de résultat}"
          fi
          touch /tmp/fakepc.stop
          cp /tmp/fakepc.log out/ 2>/dev/null || true
          cp /tmp/pchome/.state/eclipse-stream/eclipse.log out/eclipse-pc.log 2>/dev/null || true
          tar czf "emulator-api${{ matrix.api }}.tgz" out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: emulator-api${{ matrix.api }}.tgz

  release:
    needs: [apk, emulator]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Emulator results
        run: |
          ls -la art
          for f in art/emulator-api*.tgz; do echo "== $f"; tar xzf "$f" -O out/result.txt 2>/dev/null || echo "(pas de résultat)"; done

      - name: Test build (private draft, never shown as the latest version)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build -y --cleanup-tag 2>/dev/null || true
          gh release create test-build art/Eclipse.apk art/Eclipse-emulator.apk art/tunnel-e2e.log art/emulator-api*.tgz --draft --prerelease \
            --title "Build de test ($(cat VERSION), ${GITHUB_SHA::7}, émulateurs : ${{ needs.emulator.result }})" --notes "Build de test, pas une version publiée."

      - name: Publish the APK (only if it works on every emulator)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.emulator.result }}" != "success" ]; then
            echo "::error::Eclipse ne passe pas le test sur émulateur : rien n'est publié."
            exit 1
          fi
          VERSION=$(cat VERSION)
          gh release delete "v$VERSION" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" art/Eclipse.apk \
            --title "Eclipse $VERSION" --notes-file RELEASE_NOTES.md --latest
